name: disease_risk_app
description: Interpretable ML for Personalized Disease Risk Stratification

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests for API calls
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Chart visualization for feature importance
  fl_chart: ^0.68.0

  # Icons
  cupertino_icons: ^1.0.6
  
  # Local Storage
  shared_preferences: ^2.2.3
  pdf: ^3.12.0
  printing: ^5.14.3
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
